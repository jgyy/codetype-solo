          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /snippets/submissions/{id}/approve:
    post:
      operationId: approveSubmission
      description: Approve a pending submission; promotes it to a SNIPPET row.
      tags:
        - moderation
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 64
          required: true
          name: id
          in: path
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      snippetId:
                        type: string
                    required:
                      - snippetId
                required:
                  - ok
                  - data
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      snippetId:
                        type: string
                    required:
                      - snippetId
                required:
                  - ok
                  - data
        "400":
          description: bad_request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: not_found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: rate_limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: internal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /snippets/submissions/{id}/reject:
    post:
      operationId: rejectSubmission
      description: Reject a pending submission with a free-form reason.
      tags:
