  /snippets/{lang}/{id}:
    get:
      operationId: getSnippet
      description: Fetch a single snippet by language and id.
      tags:
        - public
      security: []
      parameters:
        - schema:
            type: string
            enum: *a1
          required: true
          name: lang
          in: path
        - schema:
            type: string
            minLength: 1
            maxLength: 128
          required: true
          name: id
          in: path
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      PK:
                        type: string
                      SK:
                        type: string
                      entity:
                        type: string
                        enum: &a3
                          - SNIPPET
                          - SNIPPET_RETIRED
                      id:
                        type: string
                      language:
                        type: string
                        enum: *a1
                      title:
                        type: string
                      code:
                        type: string
                      difficulty:
                        type: number
                    required:
                      - PK
                      - SK
                      - entity
                      - language
                      - title
                      - code
                      - difficulty
                required:
                  - ok
                  - data
        "400":
          description: bad_request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: not_found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: rate_limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: internal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /profile:
    post:
      operationId: upsertProfile
      description: Create or update the caller's profile (handle, leaderboard opt-in).
      tags:
        - user
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                handle:
                  type: string
                  minLength: 2
                  maxLength: 24
                  pattern: ^[a-z0-9_-]+$
                leaderboard_optin:
                  type: boolean
                display_name:
                  type: string
                  minLength: 1
                  maxLength: 48
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      created:
                        type: boolean
                      handle:
                        type: string
                      leaderboard_optin:
                        type: boolean
                      display_name:
                        type: string
                    required:
                      - created
                required:
                  - ok
                  - data
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      created:
                        type: boolean
                      handle:
                        type: string
                      leaderboard_optin:
                        type: boolean
                      display_name:
                        type: string
                    required:
                      - created
                required:
                  - ok
                  - data
        "400":
          description: bad_request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: not_found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: rate_limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: internal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /leaderboard:
    get:
      operationId: getLeaderboard
      description: Top 50 entries for a language and ISO week (defaults to current week).
      tags:
        - public
      security: []
      parameters:
        - schema:
            type: string
            enum: *a1
          required: true
          name: lang
          in: query
        - schema:
            type: string
            pattern: ^\d{4}-W\d{2}$
          required: false
          name: week
          in: query
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      lang:
                        type: string
                        enum: *a1
                      week:
                        type: string
                      entries:
                        type: array
                        items:
                          type: object
                          properties:
                            rank:
                              type: integer
                              minimum: 0
                            handle:
                              type: string
                            wpm_scaled:
                              type: number
                            attempts:
                              type: integer
                              minimum: 0
                          required:
                            - rank
                            - handle
                            - wpm_scaled
                            - attempts
                    required:
                      - lang
                      - week
                      - entries
                required:
                  - ok
                  - data
        "400":
          description: bad_request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: not_found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: rate_limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: internal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /snippets/submissions:
    post:
      operationId: submitSnippet
      description: Submit a snippet for moderator review (rate-limited per user).
      tags:
        - user
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                language:
                  type: string
                  enum: *a1
                title:
                  type: string
                  minLength: 3
                  maxLength: 80
                code:
                  type: string
                  minLength: 20
                  maxLength: 400
                difficulty:
                  anyOf:
                    - type: number
                      enum:
                        - 1
                    - type: number
                      enum:
                        - 2
                    - type: number
                      enum:
                        - 3
                    - type: number
                      enum:
                        - 4
                    - type: number
                      enum:
                        - 5
              required:
                - language
                - title
                - code
                - difficulty
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      created_at:
                        type: string
                      status:
                        type: string
                        enum:
                          - PENDING
                    required:
                      - id
                      - created_at
                      - status
                required:
                  - ok
                  - data
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      created_at:
                        type: string
                      status:
                        type: string
                        enum:
                          - PENDING
                    required:
                      - id
                      - created_at
                      - status
                required:
                  - ok
                  - data
        "400":
          description: bad_request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: not_found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: rate_limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: internal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    get:
      operationId: listSubmissions
      description: List submissions — `?mine=true` for the caller, `?status=PENDING` for mods.
      tags:
        - user
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
          required: false
          name: mine
          in: query
        - schema:
            type: string
            enum: &a2
              - PENDING
              - APPROVED
              - REJECTED
          required: false
          name: status
          in: query
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            status:
                              type: string
                              enum: *a2
                            language:
                              type: string
                              enum: *a1
                            title:
                              type: string
                            code:
                              type: string
                            difficulty:
                              type: number
                            submitter_sub:
                              type: string
                            created_at:
                              type: string
                            decided_at:
                              type: string
                            decided_by:
                              type: string
                            reject_reason:
                              type: string
                            approved_snippet_id:
                              type: string
                          required:
                            - id
                            - status
                            - language
                            - title
                            - code
                            - difficulty
                            - submitter_sub
                            - created_at
                    required:
                      - items
                required:
                  - ok
                  - data
        "400":
          description: bad_request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: not_found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: rate_limited
          content:
