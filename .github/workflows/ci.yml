name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck web
        run: bun run --filter @codetype/web typecheck
      - name: Run unit + handler + repo tests
        run: bun test
      - name: Build api handlers
        run: cd api && bun run build
      - name: Build web
        run: bun run --filter @codetype/web build
